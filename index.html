<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Soal AI - Asesmen Guru Indonesia</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- docx.js for exporting Word documents -->
    <script src="https://unpkg.com/docx@8.2.2/build/index.umd.js"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Default Subject Recommendations by Education Level & Grade
        const SUBJECTS_DATA = {
            SD: ["Bahasa Indonesia", "Matematika", "IPAS (IPA-IPS)", "Pancasila / PKN", "Pendidikan Agama", "Seni Budaya", "PJOK", "Bahasa Inggris"],
            SMP: ["Bahasa Indonesia", "Matematika", "IPA (Ilmu Pengetahuan Alam)", "IPS (Ilmu Pengetahuan Sosial)", "Bahasa Inggris", "Pancasila / PKN", "Pendidikan Agama", "Informatika", "Seni Budaya", "PJOK"],
            SMA: ["Bahasa Indonesia", "Matematika Umum", "Matematika Tingkat Lanjut", "Fisika", "Kimia", "Biologi", "Ekonomi", "Sosiologi", "Geografi", "Sejarah", "Bahasa Inggris", "Pancasila / PKN", "Pendidikan Agama", "Informatika"]
        };

        const PRESET_INSTRUCTIONS = [
            "Buat soal dalam bentuk cerita kontekstual kehidupan sehari-hari siswa.",
            "Gunakan cerita tentang fabel/dongeng lokal untuk menguji unsur intrinsik.",
            "Fokus menguji kemampuan berpikir tingkat tinggi (HOTS) level C4-C6.",
            "Gunakan kalimat sederhana dan lugas yang mudah dipahami tingkat dasar.",
            "Sajikan sebuah teks/bacaan stimulus terlebih dahulu, kemudian susun pertanyaan berdasarkan teks tersebut.",
            "Sertakan studi kasus problem solving yang relevan dengan Isu Lingkungan/Digital."
        ];

        const DB_NAME = 'GeneratorSoalDB';
        const DB_VERSION = 1;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject('Gagal membuka IndexedDB');
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('packages')) {
                        db.createObjectStore('packages', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('questionBank')) {
                        db.createObjectStore('questionBank', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'key' });
                    }
                };
            });
        };

        const dbPut = async (storeName, data) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        };

        const dbGetAll = async (storeName) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        };

        const dbDelete = async (storeName, id) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        };

        const callGeminiAPI = async (prompt, systemInstruction = "", apiKey = "") => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            let retries = 0;
            const maxRetries = 3;
            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`API Request Error [${response.status}]: ${errText}`);
                    }
                    const result = await response.json();
                    const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!jsonText) throw new Error("Format respons API tidak sesuai.");
                    return JSON.parse(jsonText);
                } catch (err) {
                    retries++;
                    if (retries >= maxRetries) throw err;
                    await new Promise(r => setTimeout(r, 1000 * Math.pow(2, retries)));
                }
            }
        };

        function App() {
            // Navigation
            const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, create, bank, history, settings

            // Notification / Alert State
            const [notification, setNotification] = useState(null);

            // API Key State
            const [apiKey, setApiKey] = useState('');

            // Wizard Step State for Generator
            const [currentStep, setCurrentStep] = useState(1);

            // Stored Packages & History
            const [packagesHistory, setPackagesHistory] = useState([]);

            // Package Identity Form State
            const [identity, setIdentity] = useState({
                schoolName: 'SD/SMP/SMA Nusantara',
                academicYear: '2026/2027',
                level: '',
                grade: '',
                subject: '',
                customSubject: '',
                semester: 'Semester 1 (Ganjil)',
                assessmentType: 'Sumatif Lingkup Materi (Ulangan Harian)'
            });

            // Materials State
            const [materials, setMaterials] = useState(['']);
            const [sasMode, setSasMode] = useState('manual'); // manual, ai_suggest, hybrid
            const [aiSuggestedMaterials, setAiSuggestedMaterials] = useState([]);
            const [acceptedAiMaterials, setAcceptedAiMaterials] = useState([]);

            // Additional Teacher Instructions
            const [additionalInstruction, setAdditionalInstruction] = useState('');

            // Question Types & Counts
            const [questionTypes, setQuestionTypes] = useState({
                pg: { enabled: true, count: 10, weight: 1 },
                pgk: { enabled: false, count: 5, weight: 2 },
                isian: { enabled: false, count: 5, weight: 2 },
                uraian: { enabled: true, count: 5, weight: 4 },
                bs: { enabled: false, count: 5, weight: 1 },
                jodohkan: { enabled: false, count: 5, weight: 2 }
            });

            // Difficulty Setting
            const [difficultyMode, setDifficultyMode] = useState('Campuran'); // Mudah, Sedang, Sulit, Campuran
            const [difficultyDist, setDifficultyDist] = useState({ mudah: 5, sedang: 7, sulit: 3 });

            // Cognitive Level Setting
            const [useCognitiveLevel, setUseCognitiveLevel] = useState(true);

            // Generated Data
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingMessage, setLoadingMessage] = useState('');
            const [gridData, setGridData] = useState([]); // Kisi-kisi
            const [questionsData, setQuestionsData] = useState([]); // Questions
            const [qualityReport, setQualityReport] = useState(null); // Quality Check Results

            // Active Package ID (if editing existing)
            const [activePackageId, setActivePackageId] = useState(null);

            // Active Preview Tab
            const [previewTab, setPreviewTab] = useState('soal'); // kisi, soal, kunci, rubrik

            // Load saved settings & packages on mount
            useEffect(() => {
                initDB().then(() => {
                    loadHistory();
                    loadApiKey();
                }).catch(err => showNotification('Error IndexedDB: ' + err, 'error'));
            }, []);

            // Re-render Lucide icons on tab or step changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, currentStep, gridData, questionsData, qualityReport]);

            const showNotification = (msg, type = 'info') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const loadHistory = async () => {
                try {
                    const data = await dbGetAll('packages');
                    setPackagesHistory(data.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)));
                } catch (e) {
                    console.error(e);
                }
            };

            const loadApiKey = async () => {
                try {
                    const res = await dbGetAll('settings');
                    const keyItem = res.find(i => i.key === 'gemini_api_key');
                    if (keyItem) setApiKey(keyItem.value);
                } catch (e) {
                    console.error(e);
                }
            };

            const saveApiKey = async (val) => {
                setApiKey(val);
                await dbPut('settings', { key: 'gemini_api_key', value: val });
                showNotification('Pengaturan API Key tersimpan!', 'success');
            };

            // Calculate total questions count
            const totalQuestionsCount = useMemo(() => {
                let total = 0;
                Object.keys(questionTypes).forEach(k => {
                    if (questionTypes[k].enabled) {
                        total += parseInt(questionTypes[k].count) || 0;
                    }
                });
                return total;
            }, [questionTypes]);

            // Handle Level Change -> Reset Grade
            const handleLevelChange = (e) => {
                const val = e.target.value;
                setIdentity(prev => ({
                    ...prev,
                    level: val,
                    grade: '',
                    subject: '',
                    customSubject: ''
                }));
            };

            // Material handlers
            const addMaterial = () => setMaterials([...materials, '']);
            const removeMaterial = (index) => {
                if (materials.length <= 1 && identity.assessmentType === 'Sumatif Lingkup Materi (Ulangan Harian)') {
                    showNotification('Ulangan Harian membutuhkan minimal 1 materi!', 'warning');
                    return;
                }
                setMaterials(materials.filter((_, i) => i !== index));
            };
            const updateMaterial = (index, val) => {
                const updated = [...materials];
                updated[index] = val;
                setMaterials(updated);
            };

            const validateStep1 = () => {
                if (!identity.level) { showNotification('Pilih Jenjang Sekolah terlebih dahulu.', 'warning'); return false; }
                if (!identity.grade) { showNotification('Pilih Kelas terlebih dahulu.', 'warning'); return false; }
                const subj = identity.subject === 'Lainnya' ? identity.customSubject : identity.subject;
                if (!subj) { showNotification('Pilih atau ketik Mata Pelajaran.', 'warning'); return false; }
                if (!identity.semester) { showNotification('Pilih Semester.', 'warning'); return false; }
                if (!identity.assessmentType) { showNotification('Pilih Jenis Asesmen.', 'warning'); return false; }
                return true;
            };

            const validateStep2 = () => {
                const activeMaterials = materials.filter(m => m.trim() !== '');
                if (identity.assessmentType === 'Sumatif Lingkup Materi (Ulangan Harian)' && activeMaterials.length === 0) {
                    showNotification('Sumatif Lingkup Materi (Ulangan Harian) wajib mengisi minimal satu materi!', 'error');
                    return false;
                }
                return true;
            };

            const validateStep3 = () => {
                let enabledCount = 0;
                Object.keys(questionTypes).forEach(k => {
                    if (questionTypes[k].enabled && parseInt(questionTypes[k].count) > 0) enabledCount++;
                });
                if (enabledCount === 0) {
                    showNotification('Pilih minimal satu bentuk soal dan jumlah soalnya!', 'warning');
                    return false;
                }

                if (difficultyMode === 'Campuran') {
                    const distTotal = (parseInt(difficultyDist.mudah) || 0) + (parseInt(difficultyDist.sedang) || 0) + (parseInt(difficultyDist.sulit) || 0);
                    if (distTotal !== totalQuestionsCount) {
                        showNotification(`Total tingkat kesulitan (${distTotal}) harus tepat sama dengan total soal (${totalQuestionsCount})!`, 'error');
                        return false;
                    }
                }
                return true;
            };

            const handleSuggestMaterials = async () => {
                if (!apiKey) {
                    showNotification('Mohon atur API Key Gemini terlebih dahulu di menu Pengaturan!', 'warning');
                    return;
                }
                setIsGenerating(true);
                setLoadingMessage('AI sedang mengusulkan cakupan materi berdasarkan Kurikulum Merdeka...');
                const subj = identity.subject === 'Lainnya' ? identity.customSubject : identity.subject;
                const prompt = `Bertindaklah sebagai pengembang Kurikulum Merdeka Indonesia. Usulkan 4-6 topik/materi utama yang relevan untuk:
Jenjang: ${identity.level}
Kelas: ${identity.grade}
Mata Pelajaran: ${subj}
Semester: ${identity.semester}
Jenis Asesmen: ${identity.assessmentType}

Format JSON persis seperti ini:
{
  "proposedMaterials": [
    "Materi 1: ...",
    "Materi 2: ..."
  ]
}`;
                try {
                    const result = await callGeminiAPI(prompt, "Anda adalah pakar kurikulum Indonesia.", apiKey);
                    if (result && result.proposedMaterials) {
                        setAiSuggestedMaterials(result.proposedMaterials);
                        setAcceptedAiMaterials(result.proposedMaterials);
                        showNotification('Berhasil mendapatkan usulan materi dari AI!', 'success');
                    }
                } catch (err) {
                    showNotification('Gagal mendapatkan usulan materi: ' + err.message, 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            // Generate Grid (Kisi-kisi)
            const handleGenerateGrid = async () => {
                if (!validateStep1() || !validateStep2() || !validateStep3()) return;

                if (!apiKey) {
                    showNotification('Silakan konfigurasi API Key Gemini di menu Pengaturan terlebih dahulu!', 'warning');
                    return;
                }

                setIsGenerating(true);
                setLoadingMessage('Tahap 1/3: AI sedang menyusun Kisi-Kisi Soal yang terstruktur...');

                const subj = identity.subject === 'Lainnya' ? identity.customSubject : identity.subject;
                const cleanMaterials = materials.filter(m => m.trim() !== '');
                const finalMaterials = [...cleanMaterials, ...acceptedAiMaterials];

                const activeTypes = Object.keys(questionTypes)
                    .filter(k => questionTypes[k].enabled)
                    .map(k => `${k.toUpperCase()}: ${questionTypes[k].count} soal`).join(', ');

                const prompt = `Susun Kisi-Kisi Soal Asesmen untuk:
Sekolah/Jenjang: ${identity.level} (Kelas ${identity.grade})
Mata Pelajaran: ${subj}
Semester: ${identity.semester}
Jenis Asesmen: ${identity.assessmentType}
Cakupan Materi: ${finalMaterials.join('; ')}
Bentuk & Jumlah Soal: ${activeTypes} (Total: ${totalQuestionsCount})
Tingkat Kesulitan: ${difficultyMode === 'Campuran' ? `Mudah: ${difficultyDist.mudah}, Sedang: ${difficultyDist.sedang}, Sulit: ${difficultyDist.sulit}` : difficultyMode}
Instruksi Tambahan Guru: ${additionalInstruction || 'Tidak ada'}

Buat JSON array untuk kisi-kisi dengan skema persis berikut:
{
  "grid": [
    {
      "no": 1,
      "materi": "Nama Materi",
      "indikator": "Indikator Soal yang spesifik dan terukur",
      "levelKognitif": "C1/C2/C3/C4/C5/C6",
      "tingkatKesulitan": "Mudah/Sedang/Sulit",
      "bentukSoal": "Pilihan Ganda / Pilihan Ganda Kompleks / Isian / Uraian / Benar-Salah / Menjodohkan",
      "nomorSoal": "1",
      "skor": 1
    }
  ]
}`;

                try {
                    const res = await callGeminiAPI(prompt, "Anda adalah spesialis penyusun kisi-kisi asesmen kurikulum Indonesia.", apiKey);
                    if (res && res.grid) {
                        setGridData(res.grid);
                        setCurrentStep(4);
                        showNotification('Kisi-kisi soal berhasil dibuat! Silakan tinjau dan sesuaikan.', 'success');
                    }
                } catch (err) {
                    showNotification('Gagal menyusun kisi-kisi: ' + err.message, 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            // Generate Questions based on approved Grid
            const handleGenerateQuestions = async () => {
                if (!apiKey) {
                    showNotification('Atur API Key terlebih dahulu!', 'warning');
                    return;
                }
                setIsGenerating(true);
                setLoadingMessage('Tahap 2/3: AI sedang menyusun Naskah Soal, Kunci Jawaban, Pembahasan & Rubrik Penskoran...');

                const subj = identity.subject === 'Lainnya' ? identity.customSubject : identity.subject;

                const prompt = `Berdasarkan Kisi-Kisi Soal berikut, hasilkan Paket Soal Lengkap beserta Kunci Jawaban, Pembahasan, dan Rubrik Penskoran.
Detail Identitas: ${identity.level} Kelas ${identity.grade}, MP: ${subj}, ${identity.semester}, ${identity.assessmentType}.
Instruksi Guru: ${additionalInstruction || 'Terapkan kausa bahasa Indonesia yang baik dan sesuai konteks kelas.'}

KISI-KISI SOAL:
${JSON.stringify(gridData, null, 2)}

PERATURAN PENTING BENTUK SOAL:
1. Pilihan Ganda (PG): Sediakan array 'options' (misal A, B, C, D atau A, B, C, D, E) dan 'answerKey' yang jelas.
2. Pilihan Ganda Kompleks (PGK): Sediakan array 'options', tandai beberapa jawaban benar pada 'answerKey' (misal: "A, C").
3. Isian Singkat: 'answerKey' berupa kata/frasa singkat.
4. Uraian: Sediakan 'answerKey' komprehensif dan 'rubrik' (pedoman penskoran bertahap).
5. Benar-Salah (BS): Sediakan 'statements' berupa list item dengan 'jawaban' masing-masing (Benar/Salah).
6. Menjodohkan: Sediakan 'leftItems' (Premis) dan 'rightItems' (Pilihan Jawaban) serta 'matchingPairs' kunci pasangannya.

Kembalikan format JSON:
{
  "questions": [
    {
      "id": "q1",
      "no": 1,
      "stimulus": "Teks cerita/bacaan/studi kasus (isi jika diperlukan oleh instruksi/indikator, jika tidak kosongkan string)",
      "materi": "Nama Materi",
      "indikator": "Indikator Soal",
      "levelKognitif": "C3",
      "tingkatKesulitan": "Sedang",
      "bentukSoal": "Pilihan Ganda",
      "questionText": "Teks pertanyaan utama...",
      "options": ["A. pilihan...", "B. pilihan...", "C. pilihan...", "D. pilihan..."],
      "statements": [],
      "leftItems": [],
      "rightItems": [],
      "answerKey": "A",
      "explanation": "Pembahasan rinci mengapa A benar...",
      "rubrik": "Pedoman penskoran...",
      "score": 1
    }
  ]
}`;

                try {
                    const res = await callGeminiAPI(prompt, "Anda adalah pembuat soal ujian nasional & asesmen sekolah yang berpengalaman.", apiKey);
                    if (res && res.questions) {
                        setQuestionsData(res.questions);
                        // Move to Step 5: Quality Check
                        await runQualityCheck(res.questions);
                        setCurrentStep(5);
                        showNotification('Naskah Soal AI berhasil dibuat!', 'success');
                    }
                } catch (err) {
                    showNotification('Gagal menyusun soal: ' + err.message, 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            const runQualityCheck = async (questionsList) => {
                setLoadingMessage('Tahap 3/3: Menguji kualitas & konsistensi naskah soal...');
                
                const prompt = `Evaluasi kualitas paket soal berikut berdasarkan kriteria kelayakan asesmen pendidikan di Indonesia.
Daftar Soal:
${JSON.stringify(questionsList, null, 2)}

Periksa:
1. Kesesuaian materi & indikator.
2. Kejelasan bahasa & kesusuaian tingkat kelas.
3. Ketepatan kunci jawaban & konsistensi bentuk soal.
4. Ada/tidaknya soal ambigu atau berulang.

Kembalikan JSON:
{
  "overallStatus": "Lulus pemeriksaan awal" | "Perlu ditinjau" | "Perlu diperbaiki",
  "score": 92,
  "findings": [
    { "no": 1, "status": "OK", "note": "Soal sudah sesuai indikator." },
    { "no": 2, "status": "Perlu Ditingkatkan", "note": "Kunci jawaban sebaiknya dilengkapi penjelasan." }
  ]
}`;

                try {
                    const res = await callGeminiAPI(prompt, "Anda adalah penilai & validator mutu soal asesmen.", apiKey);
                    if (res) {
                        setQualityReport(res);
                    }
                } catch (e) {
                    setQualityReport({
                        overallStatus: "Lulus pemeriksaan awal",
                        score: 88,
                        findings: questionsList.map(q => ({ no: q.no, status: "OK", note: "Memenuhi standar teknis dasar." }))
                    });
                }
            };

            // Regenerate Single Question
            const handleRegenerateSingleQuestion = async (index) => {
                if (!apiKey) {
                    showNotification('API key belum diset!', 'warning');
                    return;
                }
                const targetQ = questionsData[index];
                showNotification(`Memperbaiki soal nomor ${targetQ.no} dengan AI...`, 'info');

                const subj = identity.subject === 'Lainnya' ? identity.customSubject : identity.subject;
                const prompt = `Perbaiki dan buat ulang 1 soal asesmen ini agar lebih tepat, valid, dan berkualitas.
Identitas: ${identity.level} Kelas ${identity.grade}, MP: ${subj}
Materi: ${targetQ.materi}
Indikator: ${targetQ.indikator}
Bentuk Soal: ${targetQ.bentukSoal}
Tingkat Kesulitan: ${targetQ.tingkatKesulitan}

Format JSON (1 objek soal tunggal):
{
  "id": "${targetQ.id}",
  "no": ${targetQ.no},
  "stimulus": "${targetQ.stimulus || ''}",
  "materi": "${targetQ.materi}",
  "indikator": "${targetQ.indikator}",
  "levelKognitif": "${targetQ.levelKognitif}",
  "tingkatKesulitan": "${targetQ.tingkatKesulitan}",
  "bentukSoal": "${targetQ.bentukSoal}",
  "questionText": "Teks pertanyaan baru...",
  "options": ["A. ...", "B. ...", "C. ...", "D. ..."],
  "answerKey": "Kunci...",
  "explanation": "Pembahasan...",
  "rubrik": "Rubrik...",
  "score": ${targetQ.score}
}`;

                try {
                    const res = await callGeminiAPI(prompt, "Anda adalah validator dan pembuat soal profesional.", apiKey);
                    if (res) {
                        const updated = [...questionsData];
                        updated[index] = res;
                        setQuestionsData(updated);
                        showNotification(`Soal nomor ${targetQ.no} berhasil dibuat ulang!`, 'success');
                    }
                } catch (err) {
                    showNotification('Gagal memperbarui soal: ' + err.message, 'error');
                }
            };

            const handleSavePackage = async () => {
                const packageId = activePackageId || 'pkg_' + Date.now();
                const subj = identity.subject === 'Lainnya' ? identity.customSubject : identity.subject;

                const newPackage = {
                    id: packageId,
                    title: `${identity.assessmentType} ${subj} - Kelas ${identity.grade}`,
                    createdAt: new Date().toISOString(),
                    identity: { ...identity, subject: subj },
                    materials: materials.filter(m => m.trim() !== ''),
                    gridData,
                    questionsData,
                    qualityReport
                };

                try {
                    await dbPut('packages', newPackage);
                    setActivePackageId(packageId);
                    await loadHistory();
                    showNotification('Paket asesmen berhasil disimpan ke Bank Soal!', 'success');
                } catch (e) {
                    showNotification('Gagal menyimpan paket: ' + e, 'error');

                    new Paragraph({ text: "" })

                let sectionsChildren = [...headerParagraphs];

                if (exportType === 'kisi' || exportType === 'lengkap') {
                    sectionsChildren.push(
                        new Paragraph({ text: "KISI-KISI PENULISAN SOAL", heading: HeadingLevel.HEADING_2, alignment: AlignmentType.CENTER }),
                        new Paragraph({ text: "" })
                    );

                    // Grid Table Header
                    const tableRows = [
                        new TableRow({
                            children: [
                                new TableCell({ children: [new Paragraph({ text: "No", bold: true })], width: { size: 5, type: WidthType.PERCENTAGE } }),
                                new TableCell({ children: [new Paragraph({ text: "Materi", bold: true })], width: { size: 25, type: WidthType.PERCENTAGE } }),
                                new TableCell({ children: [new Paragraph({ text: "Indikator Soal", bold: true })], width: { size: 35, type: WidthType.PERCENTAGE } }),
                                new TableCell({ children: [new Paragraph({ text: "Level", bold: true })], width: { size: 10, type: WidthType.PERCENTAGE } }),
                                new TableCell({ children: [new Paragraph({ text: "Bentuk", bold: true })], width: { size: 15, type: WidthType.PERCENTAGE } }),
                                new TableCell({ children: [new Paragraph({ text: "Skor", bold: true })], width: { size: 10, type: WidthType.PERCENTAGE } })
                            ]

                    ];

                    gridData.forEach(g => {
                        tableRows.push(
                            new TableRow({
                                children: [
                                    new TableCell({ children: [new Paragraph(String(g.no))] }),
                                    new TableCell({ children: [new Paragraph(g.materi || '')] }),
                                    new TableCell({ children: [new Paragraph(g.indikator || '')] }),
                                    new TableCell({ children: [new Paragraph(g.levelKognitif || '')] }),
                                    new TableCell({ children: [new Paragraph(g.bentukSoal || '')] }),
                                    new TableCell({ children: [new Paragraph(String(g.skor || 1))] })
                                ]
                            })
                        );
                    });

                    sectionsChildren.push(new Table({ rows: tableRows, width: { size: 100, type: WidthType.PERCENTAGE } }));
                    sectionsChildren.push(new Paragraph({ text: "" }), new Paragraph({ text: "" }));
                }

                if (exportType === 'soal' || exportType === 'lengkap') {
                    sectionsChildren.push(
                        new Paragraph({ text: "NASKAH SOAL ASESMEN", heading: HeadingLevel.HEADING_2, alignment: AlignmentType.CENTER }),
                        new Paragraph({ text: "" })

                                new Paragraph({ children: [new TextRun({ text: q.stimulus })] }),
                                new Paragraph({ text: "" })
                            );

                                children: [
                                    new TextRun({ text: `${q.no}. `, bold: true }),
                                    new TextRun({ text: q.questionText })
                                ]
                            })

                        if (q.options && q.options.length > 0) {
                            q.options.forEach(opt => {
                                sectionsChildren.push(new Paragraph({ text: `    ${opt}` }));
                            });

                        // Statements if BS

                                                                    <td className="p-2 border border-slate-200 text-center font-bold">{row.no}</td>
                                                                    <td className="p-2 border border-slate-200">
                                                                        <input
                                                                            type="text"
                                                                            value={row.materi}
                                                                            onChange={e => {
                                                                                const u = [...gridData];
                                                                                u[idx].materi = e.target.value;
                                                                                setGridData(u);
                                                                            }}
                                                                            className="w-full border-none bg-transparent focus:bg-white focus:ring-1 focus:ring-indigo-500 rounded p-1"
                                                                        />
                                                                    </td>
                                                                    <td className="p-2 border border-slate-200">
                                                                        <textarea
                                                                            value={row.indikator}
                                                                            onChange={e => {
                                                                                const u = [...gridData];
                                                                                u[idx].indikator = e.target.value;
                                                                                setGridData(u);
                                                                            }}
                                                                            rows={2}
                                                                            className="w-full border-none bg-transparent focus:bg-white focus:ring-1 focus:ring-indigo-500 rounded p-1"
                                                                        />
                                                                    </td>
                                                                    <td className="p-2 border border-slate-200">
                                                                        <select
                                                                            value={row.levelKognitif}
                                                                            onChange={e => {
                                                                                const u = [...gridData];
                                                                                u[idx].levelKognitif = e.target.value;
                                                                                setGridData(u);
                                                                            }}
                                                                            className="bg-transparent border border-slate-200 rounded p-1"
                                                                        >
                                                                            {['C1','C2','C3','C4','C5','C6'].map(c => <option key={c} value={c}>{c}</option>)}
                                                                        </select>
                                                                    </td>
                                                                    <td className="p-2 border border-slate-200">
                                                                        <select
                                                                            value={row.tingkatKesulitan}
                                                                            onChange={e => {
                                                                                const u = [...gridData];
                                                                                u[idx].tingkatKesulitan = e.target.value;
                                                                                setGridData(u);
                                                                            }}
                                                                            className="bg-transparent border border-slate-200 rounded p-1"
                                                                        >
                                                                            {['Mudah','Sedang','Sulit'].map(d => <option key={d} value={d}>{d}</option>)}
                                                                        </select>
                                                                    </td>
                                                                    <td className="p-2 border border-slate-200 font-semibold">{row.bentukSoal}</td>
                                                                    <td className="p-2 border border-slate-200 w-12">
                                                                        <input
                                                                            type="number"
                                                                            value={row.skor}
                                                                            onChange={e => {
                                                                                const u = [...gridData];
                                                                                u[idx].skor = parseInt(e.target.value) || 1;
                                                                                setGridData(u);
                                                                            }}
                                                                            className="w-full border border-slate-200 rounded p-1 font-bold text-center"
                                                                        />
                                                                    </td>
                                                                    <td className="p-2 border border-slate-200 text-center">
                                                                        <button
                                                                            onClick={() => setGridData(gridData.filter((_, i) => i !== idx))}
                                                                            className="text-red-500 hover:text-red-700"
                                                                        >
                                                                            <i data-lucide="trash" className="w-4 h-4 inline"></i>
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>

                                                <div className="flex justify-between pt-4 border-t border-slate-200">
                                                    <button
                                                        onClick={() => setCurrentStep(3)}
                                                        className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded-xl text-sm font-semibold"
                                                    >
                                                        Kembali
                                                    </button>
                                                    <button
                                                        onClick={handleGenerateQuestions}
                                                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-semibold shadow flex items-center space-x-2 text-sm"
                                                    >
                                                        <i data-lucide="file-check" className="w-4 h-4 text-yellow-300"></i>
                                                        <span>Setujui & Hasilkan Naskah Soal Final</span>
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {/* STEP 5: EDITOR, QUALITY CHECK & EXPORT */}
                                        {currentStep === 5 && (
                                            <div className="space-y-6">
                                                {/* Quality Report Banner */}
                                                {qualityReport && (
                                                    <div className={`p-4 rounded-2xl border shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4 ${
                                                        qualityReport.overallStatus?.includes('Lulus') ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'
                                                    }`}>
                                                        <div className="flex items-center space-x-3">
                                                            <div className="p-3 bg-white rounded-xl shadow-sm">
                                                                <i data-lucide="check-circle-2" className="w-6 h-6 text-emerald-600"></i>
                                                            </div>
                                                            <div>
                                                                <h4 className="font-bold text-sm">Status Validasi Kualitas Soal AI: {qualityReport.overallStatus}</h4>
                                                                <p className="text-xs mt-0.5 opacity-90">
                                                                    Skor Mutu: {qualityReport.score}/100 • Evaluasi Otomatis Bahasa, Kunci & Indikator Selesai.
                                                                </p>
                                                            </div>
                                                        </div>
                                                        <button
                                                            onClick={handleSavePackage}
                                                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center space-x-1.5"
                                                        >
                                                            <i data-lucide="save" className="w-4 h-4"></i>
                                                            <span>Simpan Paket Soal</span>
                                                        </button>
                                                    </div>
                                                )}

                                                {/* Document Export Options */}
                                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                                    <h4 className="font-bold text-sm text-slate-800 flex items-center space-x-2">
                                                        <i data-lucide="download" className="w-4 h-4 text-indigo-600"></i>
                                                        <span>Ekspor Dokumen Microsoft Word (.docx) Valid:</span>
                                                    </h4>
                                                    <div className="flex flex-wrap gap-2">
                                                        {[
                                                            { id: 'kisi', label: 'Unduh Kisi-Kisi Only' },
                                                            { id: 'soal', label: 'Unduh Naskah Soal' },
                                                            { id: 'kunci', label: 'Unduh Kunci & Pembahasan' },
                                                            { id: 'rubrik', label: 'Unduh Pedoman Penskoran' },
                                                            { id: 'lengkap', label: 'Unduh Paket Lengkap (All-in-One)' }
                                                        ].map(exp => (
                                                            <button
                                                                key={exp.id}
                                                                onClick={() => exportToDocx(exp.id)}
                                                                className="bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition"
                                                            >
                                                                <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                                                                <span>{exp.label}</span>
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Preview Tabs */}
                                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                                    <div className="flex border-b border-slate-200 bg-slate-50 overflow-x-auto">
                                                        {[
                                                            { id: 'soal', label: 'Naskah Soal', icon: 'file-text' },
                                                            { id: 'kisi', label: 'Kisi-Kisi', icon: 'table' },
                                                            { id: 'kunci', label: 'Kunci & Pembahasan', icon: 'key' },
                                                            { id: 'rubrik', label: 'Rubrik Penskoran', icon: 'award' }
                                                        ].map(tab => (
                                                            <button
                                                                key={tab.id}
                                                                onClick={() => setPreviewTab(tab.id)}
                                                                className={`flex items-center space-x-2 px-5 py-3 text-xs font-bold border-b-2 whitespace-nowrap transition ${
                                                                    previewTab === tab.id ? 'border-indigo-600 text-indigo-600 bg-white' : 'border-transparent text-slate-600 hover:text-slate-900'
                                                                }`}
                                                            >
                                                                <i data-lucide={tab.icon} className="w-4 h-4"></i>
                                                                <span>{tab.label}</span>
                                                            </button>
                                                        ))}
                                                    </div>

                                                    <div className="p-6">
                                                        {/* PREVIEW: NASKAH SOAL */}
                                                        {previewTab === 'soal' && (
                                                            <div className="space-y-6">
                                                                {questionsData.map((q, idx) => (
                                                                    <div key={q.id || idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 relative group">
                                                                        <div className="flex items-center justify-between border-b pb-2">
                                                                            <span className="font-bold text-xs text-indigo-700">
                                                                                Soal Nomor {q.no} ({q.bentukSoal} • Level {q.levelKognitif || 'C3'} • {q.tingkatKesulitan})
                                                                            </span>
                                                                            <div className="flex items-center space-x-2">
                                                                                <button
                                                                                    onClick={() => handleRegenerateSingleQuestion(idx)}
                                                                                    className="text-[11px] bg-indigo-100 text-indigo-700 font-semibold px-2 py-1 rounded hover:bg-indigo-200"
                                                                                    title="Buat Ulang Soal Ini via AI"
                                                                                >
                                                                                    🔄 AI Perbaiki Soal Ini
                                                                                </button>
                                                                            </div>
                                                                        </div>

                                                                        {/* Stimulus Editor */}
                                                                        {q.stimulus && (
                                                                            <div className="p-3 bg-white rounded border border-slate-200 text-xs italic text-slate-700">
                                                                                <span className="font-bold non-italic block mb-1">Stimulus / Teks Bacaan:</span>
                                                                                <textarea
                                                                                    value={q.stimulus}
                                                                                    onChange={e => {
                                                                                        const u = [...questionsData];
                                                                                        u[idx].stimulus = e.target.value;
                                                                                        setQuestionsData(u);
                                                                                    }}
                                                                                    rows={2}
                                                                                    className="w-full border-none bg-transparent focus:bg-slate-50 outline-none text-xs"
                                                                                />
                                                                            </div>
                                                                        )}

                                                                        {/* Question Text Editor */}
                                                                        <div>
                                                                            <textarea
                                                                                value={q.questionText}
                                                                                onChange={e => {
                                                                                    const u = [...questionsData];
                                                                                    u[idx].questionText = e.target.value;
                                                                                    setQuestionsData(u);
                                                                                }}
                                                                                rows={2}
                                                                                className="w-full border border-slate-200 rounded p-2 text-xs font-semibold text-slate-800"
                                                                            />
                                                                        </div>

                                                                        {/* Multiple Choice Options */}
                                                                        {q.options && q.options.length > 0 && (
                                                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                                                {q.options.map((opt, oIdx) => (
                                                                                    <input
                                                                                        key={oIdx}
                                                                                        type="text"
                                                                                        value={opt}
                                                                                        onChange={e => {
                                                                                            const u = [...questionsData];
                                                                                            u[idx].options[oIdx] = e.target.value;
                                                                                            setQuestionsData(u);
                                                                                        }}
                                                                                        className="border border-slate-200 rounded p-1.5 text-xs bg-white"
                                                                                    />
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}

                                                        {/* PREVIEW: KUNCI & PEMBAHASAN */}
                                                        {previewTab === 'kunci' && (
                                                            <div className="space-y-4">
                                                                {questionsData.map((q, idx) => (
                                                                    <div key={idx} className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                                                                        <div className="flex justify-between font-bold text-slate-800 border-b pb-1">
                                                                            <span>Soal No. {q.no} ({q.bentukSoal})</span>
                                                                            <span className="text-emerald-700">Skor Max: {q.score}</span>
                                                                        </div>
                                                                        <div>
                                                                            <span className="font-bold text-slate-600">Kunci Jawaban: </span>
                                                                            <input
                                                                                type="text"
                                                                                value={q.answerKey}
                                                                                onChange={e => {
                                                                                    const u = [...questionsData];
                                                                                    u[idx].answerKey = e.target.value;
                                                                                    setQuestionsData(u);
                                                                                }}
                                                                                className="border border-slate-300 rounded p-1 font-bold text-emerald-800 bg-white"
                                                                            />
                                                                        </div>
                                                                        <div>
                                                                            <span className="font-bold text-slate-600 block mb-1">Pembahasan Rinci:</span>
                                                                            <textarea
                                                                                value={q.explanation}
                                                                                onChange={e => {
                                                                                    const u = [...questionsData];
                                                                                    u[idx].explanation = e.target.value;
                                                                                    setQuestionsData(u);
                                                                                }}
                                                                                rows={2}
                                                                                className="w-full border border-slate-200 rounded p-2 text-xs bg-white"
                                                                            />
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}

                                                        {/* PREVIEW: KISI-KISI */}
                                                        {previewTab === 'kisi' && (
                                                            <div className="overflow-x-auto">
                                                                <table className="w-full text-xs text-left border-collapse border border-slate-200">
                                                                    <thead className="bg-slate-100 font-bold">
                                                                        <tr>
                                                                            <th className="p-2 border">No</th>
                                                                            <th className="p-2 border">Materi</th>
                                                                            <th className="p-2 border">Indikator</th>
                                                                            <th className="p-2 border">Level</th>
                                                                            <th className="p-2 border">Kesulitan</th>
                                                                            <th className="p-2 border">Bentuk</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody>
                                                                        {gridData.map((g, i) => (
                                                                            <tr key={i}>
                                                                                <td className="p-2 border font-bold text-center">{g.no}</td>
                                                                                <td className="p-2 border">{g.materi}</td>
                                                                                <td className="p-2 border">{g.indikator}</td>
                                                                                <td className="p-2 border">{g.levelKognitif}</td>
                                                                                <td className="p-2 border">{g.tingkatKesulitan}</td>
                                                                                <td className="p-2 border">{g.bentukSoal}</td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        )}

                                                        {/* PREVIEW: RUBRIK PENSKORAN */}
                                                        {previewTab === 'rubrik' && (
                                                            <div className="space-y-4">
                                                                {questionsData.map((q, idx) => (
                                                                    <div key={idx} className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                                                                        <span className="font-bold text-indigo-900 block">Pedoman Penskoran Soal No. {q.no} ({q.bentukSoal})</span>
                                                                        <textarea
                                                                            value={q.rubrik || 'Jawaban benar mendapat skor penuh.'}
                                                                            onChange={e => {
                                                                                const u = [...questionsData];
                                                                                u[idx].rubrik = e.target.value;
                                                                                setQuestionsData(u);
                                                                            }}
                                                                            rows={2}
                                                                            className="w-full border border-slate-200 rounded p-2 bg-white"
                                                                        />
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        )}

                        {}
                        {activeTab === 'bank' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <i data-lucide="database" className="w-5 h-5 text-indigo-600"></i>
                                        <span>Bank Soal & Perpustakaan Asesmen Disimpan</span>
                                    </h3>

                                    {packagesHistory.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-sm">
                                            Belum ada bank soal. Paket yang Anda simpan akan muncul di sini.
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {packagesHistory.map(pkg => (
                                                <div key={pkg.id} className="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col justify-between">
                                                    <div>
                                                        <div className="flex justify-between items-start">
                                                            <span className="text-[10px] font-bold px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full">
                                                                {pkg.identity.level} Kelas {pkg.identity.grade}
                                                            </span>
                                                            <span className="text-[10px] text-slate-400">
                                                                {new Date(pkg.createdAt).toLocaleDateString('id-ID')}
                                                            </span>
                                                        </div>
                                                        <h4 className="font-bold text-slate-800 text-sm mt-2">{pkg.title}</h4>
                                                        <p className="text-xs text-slate-500 mt-1">
                                                            Mata Pelajaran: {pkg.identity.subject} • {pkg.questionsData?.length || 0} Soal
                                                        </p>
                                                    </div>

                                                    <div className="mt-4 pt-3 border-t border-slate-200 flex items-center justify-between">
                                                        <button
                                                            onClick={async () => {
                                                                if (confirm('Hapus paket soal ini dari Bank Soal?')) {
                                                                    await dbDelete('packages', pkg.id);
                                                                    await loadHistory();
                                                                    showNotification('Paket berhasil dihapus.', 'info');
                                                                }
                                                            }}
                                                            className="text-xs text-red-600 font-semibold hover:underline"
                                                        >
                                                            Hapus
                                                        </button>
                                                        <button
                                                            onClick={() => {
                                                                setGridData(pkg.gridData || []);
                                                                setQuestionsData(pkg.questionsData || []);
                                                                setIdentity(pkg.identity);
                                                                setActivePackageId(pkg.id);
                                                                setCurrentStep(5);
                                                                setActiveTab('create');
                                                            }}
                                                            className="text-xs font-bold bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700 shadow-sm"
                                                        >
                                                            Buka & Ekspor
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'history' && (
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                    <i data-lucide="history" className="w-5 h-5 text-indigo-600"></i>
                                    <span>Riwayat Pembuatan Paket Soal</span>
                                </h3>
                                <div className="space-y-2">
                                    {packagesHistory.map((pkg, idx) => (
                                        <div key={pkg.id || idx} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                            <div>
                                                <span className="font-bold text-slate-800">{pkg.title}</span>
                                                <span className="text-slate-500 ml-2">({new Date(pkg.createdAt).toLocaleString('id-ID')})</span>
                                            </div>
                                            <button
                                                onClick={() => {
                                                    setGridData(pkg.gridData || []);
                                                    setQuestionsData(pkg.questionsData || []);
                                                    setIdentity(pkg.identity);
                                                    setActivePackageId(pkg.id);
                                                    setCurrentStep(5);
                                                    setActiveTab('create');
                                                }}
                                                className="text-indigo-600 font-bold hover:underline"
                                            >
                                                Lihat
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'settings' && (
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                                <h3 className="text-lg font-bold text-slate-800 border-b pb-3 flex items-center space-x-2">
                                    <i data-lucide="settings" className="w-5 h-5 text-indigo-600"></i>
                                    <span>Pengaturan & Cadangan Data Lokal</span>
                                </h3>

                                {/* Gemini API Key Config */}
                                <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <h4 className="font-bold text-xs text-slate-800 flex items-center space-x-2">
                                        <i data-lucide="key" className="w-4 h-4 text-indigo-600"></i>
                                        <span>Konfigurasi Gemini API Key:</span>
                                    </h4>
                                    <p className="text-xs text-slate-600 leading-relaxed">
                                        Generator Soal AI menggunakan API resmi Google Gemini. Masukkan API Key Anda di bawah ini untuk mengaktifkan seluruh kemampuan pemrosesan bahasa alami Kurikulum Merdeka.
                                    </p>
                                    <div className="flex space-x-2">
                                        <input
                                            type="password"
                                            value={apiKey}
                                            onChange={e => setApiKey(e.target.value)}
                                            placeholder="Masukkan Gemini API Key..."
                                            className="flex-1 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                                        />
                                        <button
                                            onClick={() => saveApiKey(apiKey)}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-xs font-bold shadow"
                                        >
                                            Simpan
                                        </button>
                                    </div>
                                </div>

                                {/* Backup & Restore */}
                                <div className="space-y-3 pt-4 border-t border-slate-200">
                                    <h4 className="font-bold text-xs text-slate-800 flex items-center space-x-2">
                                        <i data-lucide="hard-drive" className="w-4 h-4 text-indigo-600"></i>
                                        <span>Cadangan Data (Backup & Restore IndexedDB):</span>
                                    </h4>
                                    <div className="flex flex-wrap gap-3">
                                        <button
                                            onClick={handleExportBackup}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow flex items-center space-x-2"
                                        >
                                            <i data-lucide="download-cloud" className="w-4 h-4"></i>
                                            <span>Ekspor Backup JSON</span>
                                        </button>

                                        <label className="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer flex items-center space-x-2">
                                            <i data-lucide="upload-cloud" className="w-4 h-4"></i>
                                            <span>Impor File Backup</span>
                                            <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    <footer className="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
                        <div className="max-w-7xl mx-auto px-4 space-y-1">
                            <p className="font-semibold text-slate-300">Generator Soal AI - Asesmen Guru Indonesia © 2026</p>
                            <p className="text-[11px]">Dukungan Kurikulum Merdeka • Berjalan 100% di Browser dengan Penyimpanan Lokal IndexedDB</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
