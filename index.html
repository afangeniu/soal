        const DB_NAME = 'AiGuruExamGeneratorDB';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_PACKAGES)) {
                        const store = db.createObjectStore(STORE_PACKAGES, { keyPath: 'id' });
                        store.createIndex('updatedAt', 'updatedAt', { unique: false });
                        store.createIndex('subject', 'subject', { unique: false });
                        store.createIndex('gradeLevel', 'gradeLevel', { unique: false });
                    }
                    if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
                        db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function dbSavePackage(pkg) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PACKAGES, 'readwrite');
                const store = tx.objectStore(STORE_PACKAGES);
                pkg.updatedAt = new Date().toISOString();
                const req = store.put(pkg);
                req.onsuccess = () => resolve(pkg.id);
                req.onerror = () => reject(req.error);
            });
        }

        async function dbGetAllPackages() {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PACKAGES, 'readonly');
                const store = tx.objectStore(STORE_PACKAGES);
                const req = store.getAll();
                req.onsuccess = () => {
                    const items = req.result || [];
                    items.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                    resolve(items);
                };
                req.onerror = () => reject(req.error);
            });
        }

        async function dbDeletePackage(id) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PACKAGES, 'readwrite');
                const store = tx.objectStore(STORE_PACKAGES);
                const req = store.delete(id);
                req.onsuccess = () => resolve(true);
                req.onerror = () => reject(req.error);
            });
        }

        function validateQuestionPackage(pkg) {
            const report = {
                status: 'PASSED', // PASSED, WARNING, FAILED
                items: []
            };

            if (!pkg || !pkg.questions || pkg.questions.length === 0) {
                report.status = 'FAILED';
                report.items.push({ type: 'error', message: 'Paket soal tidak berisi butir soal.' });
                return report;
            }

            const questions = pkg.questions;
            const seenQuestions = new Set();

            questions.forEach((q, idx) => {
                const qNum = idx + 1;

                // Check empty text
                if (!q.question || q.question.trim().length < 5) {
                    report.items.push({ type: 'error', message: `Soal #${qNum}: Teks pertanyaan terlalu singkat atau kosong.` });
                    report.status = 'FAILED';
                }

                // Check similarity / duplicate text
                const normalizedText = (q.question || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                if (seenQuestions.has(normalizedText)) {
                    report.items.push({ type: 'warning', message: `Soal #${qNum}: Terdeteksi memiliki kemiripan tinggi / terduplikasi dengan soal lain.` });
                    if (report.status !== 'FAILED') report.status = 'WARNING';
                } else {
                    seenQuestions.add(normalizedText);
                }

                // Multiple choice checks
                if (q.type === 'multiple_choice' || q.type === 'complex_mc') {
                    if (!q.options || q.options.length < 2) {
                        report.items.push({ type: 'error', message: `Soal #${qNum}: Pilihan ganda harus memiliki minimal 2 opsi.` });
                        report.status = 'FAILED';
                    }
                    if (!q.correctAnswers || q.correctAnswers.length === 0) {
                        report.items.push({ type: 'error', message: `Soal #${qNum}: Kunci jawaban belum ditentukan.` });
                        report.status = 'FAILED';
                    }
                }

                // Missing explanation
                if (!q.explanation || q.explanation.trim().length < 3) {
                    report.items.push({ type: 'warning', message: `Soal #${qNum}: Pembahasan / rubrik penilaian belum diisi.` });
                    if (report.status !== 'FAILED') report.status = 'WARNING';
                }
            });

            if (report.items.length === 0) {
                report.items.push({ type: 'success', message: 'Seluruh butir soal lulus validasi kualitas Kurikulum Merdeka!' });
            }

            return report;
        }

        function exportPackageToDocx(pkg, options = { includeKey: true, separateKey: false }) {
            const schoolName = options.schoolName || 'NAMA SEKOLAH / SATUAN PENDIDIKAN';
            const teacherName = options.teacherName || 'GURU MATA PELAJARAN';
            const academicYear = options.academicYear || '2025/2026';

            // HTML Representation for Word Conversion
            const generateHtmlDoc = (isAnswerKeyOnly) => {
                const headerTitle = isAnswerKeyOnly ? 'KUNCI JAWABAN & PEMBAHASAN' : String(pkg.assessmentType || '').toUpperCase() + ' - SEMESTER ' + pkg.semester;
                
                let questionsHtml = '';
                pkg.questions.forEach((q, idx) => {
                    const qNum = idx + 1;
                    if (isAnswerKeyOnly) {
                        const keyStr = Array.isArray(q.correctAnswers) ? q.correctAnswers.join(', ') : q.correctAnswers;
                        const expStr = q.explanation || 'Sesuai dengan indikator Capaian Pembelajaran.';
                        questionsHtml += '<div class="q-block">' +
                            '<div class="q-text">' + qNum + '. [' + q.type.toUpperCase() + '] Kunci: ' + keyStr + '</div>' +
                            '<div class="key-box"><strong>Pembahasan:</strong> ' + expStr + '</div>' +
                            '</div>';
                        return;
                    }

                    let content = '<div class="q-block"><div class="q-text">' + qNum + '. ' + q.question + '</div>';

                    if (q.options && q.options.length > 0) {
                        content += '<table class="opt-table">';
                        q.options.forEach(opt => {
                            content += '<tr><td width="5%">' + opt.id + '.</td><td>' + opt.text + '</td></tr>';
                        });
                        content += '</table>';
                    }

                    if (q.type === 'matching' && q.pairs) {
                        content += '<table style="width: 90%; margin-left: 20px; border: 1px solid #ccc; margin-top: 6px; border-collapse: collapse;">';
                        q.pairs.forEach(p => {
                            content += '<tr><td style="border: 1px solid #ccc; padding: 4px;">' + p.left + '</td><td style="border: 1px solid #ccc; padding: 4px;">...</td><td style="border: 1px solid #ccc; padding: 4px;">' + p.right + '</td></tr>';
                        });
                        content += '</table>';
                    }

                    if (options.includeKey && !options.separateKey) {
                        const keyAns = Array.isArray(q.correctAnswers) ? q.correctAnswers.join(', ') : q.correctAnswers;
                        content += '<div class="key-box">' +
                            '<strong>Kunci Jawaban:</strong> ' + keyAns + '<br/>' +
                            '<strong>Pembahasan:</strong> ' + (q.explanation || '-') +
                            '</div>';
                    }

                    content += '</div>';
                    questionsHtml += content;
                });

                return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
                    '<head><meta charset="utf-8"><title>' + pkg.title + '</title>' +
                    '<style>' +
                    'body { font-family: "Calibri", "Arial", sans-serif; font-size: 11pt; line-height: 1.25; margin: 1in; }' +
                    'h2 { text-align: center; margin-bottom: 2px; font-size: 14pt; text-transform: uppercase; }' +
                    'h3 { text-align: center; margin-top: 0; font-size: 12pt; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 15px; }' +
                    'table.meta { width: 100%; margin-bottom: 15px; border-collapse: collapse; }' +
                    'table.meta td { padding: 3px 0; font-size: 10.5pt; vertical-align: top; }' +
                    '.q-block { margin-bottom: 12px; page-break-inside: avoid; }' +
                    '.q-text { font-weight: bold; margin-bottom: 4px; }' +
                    '.opt-table { width: 100%; margin-left: 15px; border-collapse: collapse; }' +
                    '.opt-table td { padding: 2px 4px; vertical-align: top; }' +
                    '.key-box { background-color: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px; margin-top: 4px; font-size: 10pt; }' +
                    '.footer-table { width: 100%; margin-top: 30px; border-collapse: collapse; }' +
                    '.footer-table td { text-align: center; width: 50%; font-size: 10.5pt; }' +
                    '</style></head>' +
                    '<body>' +
                    '<h2>' + schoolName + '</h2>' +
                    '<h3>' + headerTitle + '</h3>' +
                    '<table class="meta">' +
                    '<tr>' +
                    '<td width="15%"><strong>Mata Pelajaran</strong></td>' +
                    '<td width="35%">: ' + pkg.subject + '</td>' +
                    '<td width="15%"><strong>Kelas / Jenjang</strong></td>' +
                    '<td width="35%">: Kelas ' + pkg.grade + ' (' + pkg.gradeLevel + ')</td>' +
                    '</tr>' +
                    '<tr>' +
                    '<td><strong>Materi / Topik</strong></td>' +
                    '<td>: ' + (pkg.topic || 'Capaian Pembelajaran Merdeka') + '</td>' +
                    '<td><strong>Tahun Ajaran</strong></td>' +
                    '<td>: ' + academicYear + '</td>' +
                    '</tr>' +
                    '</table>' +
                    '<hr style="border: 1px solid #000; margin-bottom: 15px;" />' +
                    questionsHtml +
                    '<table class="footer-table">' +
                    '<tr>' +
                    '<td><br/>Mengetahui,<br/>Kepala Sekolah<br/><br/><br/><br/>______________________</td>' +
                    '<td><br/>Guru Mata Pelajaran,<br/><br/><br/><br/><strong>' + teacherName + '</strong></td>' +
                    '</tr>' +
                    '</table>' +
                    'body></html>';
            };

            const downloadDoc = (htmlContent, fileName) => {
                const blob = new Blob(['\ufeff', htmlContent], {
                    type: 'application/msword'
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            if (options.separateKey) {
                // Download Questions doc
                downloadDoc(generateHtmlDoc(false), `${pkg.title}_Soal.doc`);
                // Download Answers doc
                setTimeout(() => {
                    downloadDoc(generateHtmlDoc(true), `${pkg.title}_KunciJawaban.doc`);
                }, 500);
            } else {
                downloadDoc(generateHtmlDoc(false), `${pkg.title}.doc`);
            }
        }

                                                            </thead>
                                                            <tbody>
                                                                {q.pairs.map((p, pIdx) => (
                                                                    <tr key={pIdx}>
                                                                        <td className="border border-slate-300 p-2">{p.left}</td>
                                                                        <td className="border border-slate-300 p-2">{p.right}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}

                                                {/* Key & Discussion Box */}
                                                <div className="mt-3 ml-6 p-3 bg-blue-50/70 border border-blue-100 rounded-lg text-xs text-slate-700">
                                                    <div className="font-bold text-blue-900">
                                                        Kunci Jawaban: {Array.isArray(q.correctAnswers) ? q.correctAnswers.join(', ') : q.correctAnswers}
                                                    </div>
                                                    <div className="mt-1 text-slate-600">
                                                        <strong>Pembahasan:</strong> {q.explanation}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: HISTORY & SAVED PACKAGES */}
                        {activeTab === 'history' && (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-100">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800">Riwayat Paket Soal Tersimpan</h2>
                                        <p className="text-xs text-slate-500">Seluruh data tersimpan secara aman pada memori browser IndexedDB lokal Anda.</p>
                                    </div>
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Cari mata pelajaran / topik..."
                                        className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs w-full sm:w-64"
                                    />
                                </div>

                                <div className="mt-6 space-y-4">
                                    {historyList.filter(h => h.title.toLowerCase().includes(searchQuery.toLowerCase()) || h.subject.toLowerCase().includes(searchQuery.toLowerCase())).length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-sm">Belum ada paket soal tersimpan.</div>
                                    ) : (
                                        historyList
                                            .filter(h => h.title.toLowerCase().includes(searchQuery.toLowerCase()) || h.subject.toLowerCase().includes(searchQuery.toLowerCase()))
                                            .map((item) => (
                                                <div key={item.id} className="p-4 rounded-xl border border-slate-200 hover:border-indigo-300 transition flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-50/50">
                                                    <div>
                                                        <h3 className="text-sm font-bold text-slate-800">{item.title}</h3>
                                                        <p className="text-xs text-slate-500 mt-0.5">
                                                            {item.questions ? item.questions.length : 0} Soal • {new Date(item.updatedAt).toLocaleDateString('id-ID')}
                                                        </p>
                                                    </div>
                                                    <div className="flex items-center space-x-2">
                                                        <button
                                                            onClick={() => { setCurrentPackage(item); setActiveTab('preview'); }}
                                                            className="px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 transition"
                                                        >
                                                            Buka
                                                        </button>
                                                        <button
                                                            onClick={async () => {
                                                                if (confirm('Hapus paket soal ini?')) {
                                                                    await dbDeletePackage(item.id);
                                                                    loadHistory();
                                                                }
                                                            }}
                                                            className="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 text-xs font-semibold transition"
                                                        >
                                                            Hapus
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: API SETTINGS */}
                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
                                <h2 className="text-lg font-bold text-slate-800 mb-2">Pengaturan API Key Google Gemini</h2>
                                <p className="text-xs text-slate-500 mb-6">Konfigurasikan API Key untuk mengaktifkan AI generator Kurikulum Merdeka secara langsung.</p>

                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Mode Operasi</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button
                                                type="button"
                                                onClick={() => setAiProvider('demo')}
                                                className={`p-3 rounded-xl border text-xs font-bold ${aiProvider === 'demo' ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-white border-slate-200 text-slate-600'}`}
                                            >
                                                Mode Demo Offline
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setAiProvider('gemini')}
                                                className={`p-3 rounded-xl border text-xs font-bold ${aiProvider === 'gemini' ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-white border-slate-200 text-slate-600'}`}
                                            >
                                                Google Gemini API
                                            </button>
                                        </div>
                                    </div>

                                    {aiProvider === 'gemini' && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Google Gemini API Key</label>
                                            <input
                                                type="password"
                                                value={apiKey}
                                                onChange={(e) => setApiKey(e.target.value)}
                                                placeholder="AIzaSy..."
                                                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500"
                                            />
                                            <div className="mt-3 p-3 bg-blue-50 border border-blue-100 rounded-xl text-xs text-blue-900 space-y-1">
                                                <div className="font-bold">Cara mendapatkan API Key Gratis:</div>
                                                <ol className="list-decimal list-inside space-y-1">
                                                    <li>Buka <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="underline font-bold text-indigo-700">Google AI Studio</a>.</li>
                                                    <li>Login dengan akun Google Anda.</li>
                                                    <li>Klik "Create API Key" lalu salin ke kolom di atas.</li>
                                                </ol>
                                            </div>
                                        </div>
                                    )}

                                    <div className="pt-4 border-t border-slate-100">
                                        <button
                                            type="button"
                                            onClick={() => saveApiKeySettings(apiKey, aiProvider)}
                                            className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow transition"
                                        >
                                            Simpan Pengaturan
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 no-print">
                        GENERATOR SOAL AI GURU • Kurikulum Merdeka & Deep Learning Asesmen • Disusun untuk Pendidikan Indonesia
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
